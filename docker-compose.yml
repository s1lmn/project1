services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sports_mate
      POSTGRES_USER: sports_mate
      POSTGRES_PASSWORD: sports_mate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_mate"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  migrate:
    build: ./apps/api
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./apps/api
    env_file: .env
    command: python -m app.worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-sportssmatebot}
        VITE_ENABLE_DEV_AUTH: ${VITE_ENABLE_DEV_AUTH:-true}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
